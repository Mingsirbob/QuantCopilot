# ===================================================================
# MultiAgent 统一声明式任务调度配置文件 (schedule.yaml)
# 
# 任务定义结构示例:
# 
# 1. 原生 Python 分析模块任务:
#   - name: my_calc_task
#     type: module
#     target: "workspace.modules.my_module:my_function"
#     trigger: "cron: 30 8 * * 1-5"   # 交易日 08:30 触发
# 
# 2. 独立外部脚本任务:
#   - name: my_script_task
#     type: script
#     script_path: "workspace/scripts/my_script.py"
#     trigger: "interval: 60"          # 每 60 秒轮询一次
# 
# 3. 智能体 Agent 任务:
#   - name: my_agent_task
#     type: agent
#     agent_name: data_analyst         # 对应 workspace/agents/ 下目录名
#     prompt: "请执行分析任务..."
#     trigger: "cron: 0 9 * * 1-5"     # 交易日 09:00 触发
# ===================================================================

schedules:
  # -----------------------------------------------------------------
  # 任务 1：个股盘口逐笔异动实时监测任务 (外部脚本)
  # -----------------------------------------------------------------
  - name: stock_price_monitor
    type: script
    script_path: "workspace/scripts/stock_monitor.py"
    description: "五粮液(000858.SZ) 盘口逐笔异动实时监测脚本 (按需或条件启动)"

  # -----------------------------------------------------------------
  # 任务 2：个股异动深度调研 Agent (固定任务，由监测脚本触发)
  # -----------------------------------------------------------------
  - name: stock_anomaly_analyst
    type: agent
    agent_name: data_analyst
    prompt: "{prompt}"
    description: "个股异动深度调研分析 Agent (待命中，复用固定任务模板)"
